<style>
/* Layout: barra de demo + navegación por módulo + una vista a la vez, como una app de escritorio que se adapta a móvil */
:root{

  --fg:#1B2430; --muted:#566377; --navy:#0A6BAE; --navy-fg:#FFFFFF; --tint:#E3F1FB; --acc:#1DB1F5; --acc-fg:#04121C;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1A212B; --surface2:#202936; --line:#2E3949; --line2:#263040;
  --fg:#E6EAF0; --muted:#9AA7B8; --navy:#4CC3FF; --navy-fg:#04121C; --tint:#12293A; --acc:#1DB1F5; --acc-fg:#04121C;
  --ok:#7CCBA0; --ok-bg:#183326; --warn:#E8BE6A; --warn-bg:#3A2D10; --bad:#EE9A9A; --bad-bg:#3C1E1E; --idle:#A7B3C4; --idle-bg:#273141;
  --input:#5E6C80; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1A212B; --surface2:#202936; --line:#2E3949; --line2:#263040;
  --fg:#E6EAF0; --muted:#9AA7B8; --navy:#4CC3FF; --navy-fg:#04121C; --tint:#12293A; --acc:#1DB1F5; --acc-fg:#04121C;
  --ok:#7CCBA0; --ok-bg:#183326; --warn:#E8BE6A; --warn-bg:#3A2D10; --bad:#EE9A9A; --bad-bg:#3C1E1E; --idle:#A7B3C4; --idle-bg:#273141;
  --input:#5E6C80; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px}

h2{font-size:15px;font-weight:600;margin:0;color:var(--navy)}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.topbar{background:#05080C;color:#DCE6F0;border:1px solid #1B2430;border-radius:14px 14px 0 0;padding:10px 18px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}

.nav button:hover{opacity:1}
.demo{background:var(--surface2);border:1px dashed var(--input);border-top:0;border-radius:0 0 8px 8px;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.demo label{display:flex;align-items:center;gap:8px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{height:36px;border:1px solid var(--input);border-radius:5px;background:var(--surface);padding:0 10px;width:100%;min-width:0}

input.err,select.err{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.btn{height:36px;padding:0 16px;border-radius:5px;border:1px solid var(--input);background:var(--surface);font-weight:500}

.btn.danger{border-color:var(--bad);color:var(--bad)}

.link{background:none;border:0;color:var(--navy);padding:0;text-decoration:underline;font-weight:500}

.estsm{font-size:12.5px;font-weight:500;margin-top:2px}
.concs{font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.qrow{grid-template-columns:128px 112px minmax(0,1fr) 112px;align-items:center;gap:16px}
.concs .ln span,.concs .ln small{white-space:nowrap}

.pill.est{min-width:148px;justify-content:center}
.btn.fix{width:112px;padding:0;white-space:nowrap}
td.n,td.nw{white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th{background:var(--tint);color:var(--navy);text-align:left;font-size:12px;font-weight:600;padding:9px 12px;white-space:nowrap}
th button{background:none;border:0;font:inherit;color:inherit;font-weight:600;padding:0}
td{font-size:13.5px;padding:10px 12px;border-top:1px solid var(--line2);vertical-align:middle}
tr.rowbad td{background:var(--bad-bg)}tr.rowidle td{background:var(--surface2);color:var(--muted)}
.chip{border:1px solid var(--input);background:var(--surface);border-radius:14px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.menu{position:fixed;z-index:25;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px var(--shadow);padding:6px;display:flex;flex-direction:column}

.menu button.danger{color:var(--bad)}
.card,.tblwrap{box-shadow:0 1px 2px rgba(10,30,50,.05)}
.crumb{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:6px;border:1px solid}

.steps{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.step.on{color:var(--navy);font-weight:600}.step.on i{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.step.done i{background:var(--idle);border-color:var(--idle);color:var(--surface)}
.opt{border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.opt.sel{border-color:var(--navy);border-width:2px}
.opt .h{padding:12px 14px;border-bottom:1px solid var(--line2)}
.opt .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opt .f{padding:12px 14px;border-top:1px solid var(--line2);background:var(--surface2);display:flex;flex-direction:column;gap:8px;border-radius:0 0 7px 7px}
.ln{display:flex;gap:8px;justify-content:space-between}
.ln.dim{color:var(--muted)}
.ln small{color:var(--muted)}
.overlay{position:fixed;inset:0;background:var(--shadow);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30;max-width:90vw}
.note{font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- reglas de negocio ---------- */
function estadoEn(t,fecha){
  if(!t.activo)return {k:'Inactiva',c:'idle',i:'–',txt:'Inactiva'};
  if(fecha<t.desde)return {k:'Programada',c:'idle',i:'○',txt:'Programada'};
  if(fecha>t.hasta)return {k:'Vencida',c:'bad',i:'■',txt:'Vencida'};
  var left=days(fecha,t.hasta),av=S.params.aviso[t.modo];
  if(left<=av)return {k:'Por vencer',c:'warn',i:'▲',txt:'Por vencer · '+(left===0?'vence hoy':left+(left===1?' día':' días')),left:left};
  return {k:'Vigente',c:'ok',i:'●',txt:'Vigente'};
}
var est=function(t){return estadoEn(t,S.hoy)};
function pill(e){return '<span class="pill est '+e.c+'">'+e.i+' '+esc(e.txt)+'</span>'}
function claveIgual(a,b){return a.prov===b.prov&&a.modo===b.modo&&a.origen===b.origen&&a.destino===b.destino&&a.equipo===b.equipo&&a.unidad===b.unidad}
function traslape(t,excl){return S.tarifas.filter(function(o){return o.activo&&o.id!==excl&&claveIgual(o,t)&&o.desde<=t.hasta&&t.desde<=o.hasta})}
function unidadDe(equipo){return equipo==='LCL'?'W/M':equipo==='Carga aérea'?'kg':equipo==='Camión'?'Viaje':'Contenedor'}
function medidas(c){var wm=Math.max(+c.m3||0,+c.ton||0),vol=(+c.piezas||0)*(+c.l||0)*(+c.a||0)*(+c.al||0)/6000;return {cant:+c.cant||0,wm:wm,vol:vol,kg:Math.max(+c.kg||0,vol),real:+c.kg||0}}
function qty(u,m,min){
  if(u==='Contenedor')return [m.cant,m.cant+' × contenedor'];
  if(u==='Viaje')return [m.cant,m.cant+' × viaje'];
  if(u==='W/M'){var c=Math.max(m.wm,min||0);return [c,nf(c,2)+' W/M'+(c>m.wm?' (mínimo)':'')]}
  if(u==='kg'){var k=Math.max(m.kg,min||0);return [k,nf(k,1)+' kg cobrables'+(k>m.kg?' (mínimo)':'')]}
  return [1,'1 embarque']
}
function costo(t,q,fecha,tc){
  var m=medidas(q.carga),lines=[],needsTC=false,flete=0,fl=qty(t.unidad,m,t.minimo),unit=t.flete,nota='';
  if(t.tramos&&t.tramos.length){var tr=t.tramos.filter(function(x){return fl[0]>=x.desde&&(x.hasta==null||fl[0]<x.hasta)})[0];unit=tr?tr.valor:0;nota=tr?'tramo '+(tr.hasta==null?'+'+tr.desde+' kg':tr.desde+'–'+tr.hasta+' kg'):''}
  flete=unit*fl[0];
  var conv=function(a,mo){if(mo==='USD')return a;if(tc>0)return a/tc;needsTC=true;return null};
  lines.push({k:'Flete',det:fl[1]+' × '+t.moneda+' '+nf(unit)+(nota?' · '+nota:''),amt:flete,mo:t.moneda,usd:conv(flete,t.moneda),ap:true});
  t.recargos.forEach(function(r){
    var ln={k:r.concepto,mo:r.moneda,ap:true,det:''};
    if(r.incluido){ln.amt=0;ln.usd=0;ln.det='incluido en el flete';ln.dim=true}
    else if(r.desde&&fecha<r.desde){ln.amt=0;ln.usd=0;ln.ap=false;ln.dim=true;ln.det='aplica desde '+fd(r.desde)+', no se suma en esta fecha ('+r.moneda+' '+nf(r.monto)+')'}
    else{
      var a;
      if(r.unidad==='% del flete'){a=flete*r.monto/100;ln.det=nf(r.monto)+'% del flete';ln.mo=t.moneda}
      else{var qq=qty(r.unidad,m,r.unidad===t.unidad?t.minimo:0);a=r.monto*qq[0];ln.det=qq[1]+' × '+r.moneda+' '+nf(r.monto)}
      ln.amt=a;ln.usd=conv(a,ln.mo)
    }
    lines.push(ln)});
  var total=0;lines.forEach(function(l){if(l.usd==null)total=null;else if(total!=null)total+=l.usd});
  return {lines:lines,total:total,needsTC:needsTC,m:m}
}
function precioDe(q,t,c){var p=q.precios[t.id];if(p!=null&&p!=='')return +p;return c.total==null?0:Math.ceil(c.total/0.86/10)*10}
function margenDe(precio,total){if(total==null||!precio)return null;return {m:precio-total,p:(precio-total)/precio*100}}

}

function validarFila(r,i,prev){
  var p=r[0],o=r[1],d=r[2],eq=r[3],u=r[4],fl=r[5],mo=r[6],ds=r[7],hs=r[8],err=[];
  var prv=S.listas.proveedores.filter(function(x){return x.a&&x.n===p})[0];
  if(!prv)err.push('Proveedor: “'+p+'” no está en la lista');
  if(!S.listas.ubicaciones.some(function(x){return x.a&&x.n===o}))err.push('Origen: “'+o+'” no está en la lista');
  if(!S.listas.ubicaciones.some(function(x){return x.a&&x.n===d}))err.push('Destino: “'+d+'” no está en la lista');
  if(!S.listas.equipos.some(function(x){return x.a&&x.n===eq}))err.push('Equipo: “'+eq+'” no está en la lista');
  if(!S.listas.monedas.some(function(x){return x.a&&x.n===mo}))err.push('Moneda: “'+mo+'” no está en la lista');
  var num=Number(String(fl).replace(/,/g,''));if(!(num>0))err.push('Flete: “'+fl+'” no es un monto');
  var pd=function(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);return m?m[3]+'-'+m[2]+'-'+m[1]:null};
  var a=pd(ds),b=pd(hs);
  if(!a)err.push('Vigencia desde: “'+ds+'” no es una fecha (dd/mm/aaaa)');
  if(!b)err.push('Vigencia hasta: “'+hs+'” no es una fecha (dd/mm/aaaa)');
  if(a&&b&&b<a)err.push('Vigencia: hasta es anterior a desde');
  if(err.length)return {k:'error',msg:err[0]};
  var t={prov:p,modo:prv.x,origen:o,destino:d,equipo:eq,unidad:u,desde:a,hasta:b,flete:num,moneda:mo};
  var dup=S.tarifas.concat(prev).some(function(x){return x.activo!==false&&claveIgual(x,t)&&x.desde===a&&x.hasta===b});
  if(dup)return {k:'dup',msg:'Ya existe con la misma vigencia. No se crea.'};
  var tr=S.tarifas.concat(prev).filter(function(x){return x.activo!==false&&claveIgual(x,t)&&x.desde<=b&&a<=x.hasta});
  if(tr.length)return {k:'error',msg:'Se traslapa con otra tarifa activa ('+fd(tr[0].desde)+'–'+fd(tr[0].hasta)+')'};
  return {k:'ok',msg:'Lista para importar',t:t}
}

function cFlete(r){var n=Number(String(r[5]).replace(/,/g,''));return n>0&&S.listas.monedas.some(function(x){return x.n===r[6]})?r[6]+' '+nf(n):esc(r[5])+' '+esc(r[6])}

/* --- Listas y parámetros --- */
var LN={proveedores:'Proveedores',ubicaciones:'Origen y destino',equipos:'Equipos',monedas:'Monedas',conceptos:'Conceptos de recargo',unidades:'Unidades de cobro'};

  '<div class="tblwrap"><table style="min-width:520px"><thead><tr><th>Nombre</th><th>'+(ex||'')+'</th><th>Estado</th><th>Uso</th><th></th></tr></thead><tbody>'+L.map(function(x,i){var u=enUso(k,x.n);return '<tr class="'+(x.a?'':'rowidle')+'"><td><b>'+esc(x.n)+'</b></td><td>'+esc(x.x||'')+'</td><td>'+(x.a?'<span class="pill est ok">● Activo</span>':'<span class="pill est idle">– Inactivo</span>')+'</td><td class="muted">'+(u?'En uso en tarifas':'Sin uso')+'</td><td><div class="row" style="gap:6px"><button class="btn sm" data-a="toglista" data-i="'+i+'">'+(x.a?'Inactivar':'Activar')+'</button>'+(!u?'<button class="btn sm danger" data-a="dellista" data-i="'+i+'">Eliminar</button>':'')+'</div></td></tr>'}).join('')+'</tbody></table></div>'+

}

/* --- Cotizador --- */
function opcionesBuscar(){
  var q=S.quote,tc=+q.tc||0;
  return S.tarifas.filter(function(t){return t.activo&&t.modo===q.modo&&t.equipo===q.equipo&&t.origen===q.origen&&t.destino===q.destino&&q.fecha>=t.desde&&q.fecha<=t.hasta})
   .map(function(t){return {t:t,c:costo(t,q,q.fecha,tc)}}).sort(function(a,b){return (a.c.total==null?1e12:a.c.total)-(b.c.total==null?1e12:b.c.total)})
}
function concs(c){
  return c.lines.map(function(l){
    if(!l.ap){var m=/desde (\d\d\/\d\d)/.exec(l.det||'');return '<div class="ln dim"><span>'+esc(l.k)+'</span><small>aplica desde '+(m?m[1]:'')+'</small></div>'}
    if(l.dim)return '<div class="ln dim"><span>'+esc(l.k)+'</span><small>incluido</small></div>';
    return '<div class="ln"><span>'+esc(l.k)+'</span><span class="num">'+(l.usd==null?esc(l.mo)+' '+nf(l.amt)+' <small>(falta TC)</small>':money(l.usd))+'</span></div>'}).join('')
}
function cargaCampos(q){
  var u=unidadDe(q.equipo),c=q.carga,fld=function(k,l,st){return '<div class="field"><label for="c_'+k+'">'+l+'</label><input id="c_'+k+'" type="number" step="any" min="0" data-f="carga.'+k+'" value="'+esc(c[k])+'"'+(st?' step="'+st+'"':'')+'></div>'};
  if(u==='W/M')return fld('m3','Volumen (m³)')+fld('ton','Peso (toneladas)');
  if(u==='kg')return fld('piezas','Piezas')+fld('l','Largo (cm)')+fld('a','Ancho (cm)')+fld('al','Alto (cm)')+fld('kg','Peso real total (kg)');
  return fld('cant',u==='Viaje'?'Viajes':'Cantidad')
}
function ofrecidas(q){
  var ok=function(t){return t.activo&&t.modo===q.modo},vig=S.tarifas.filter(function(t){var e=estadoEn(t,q.fecha).k;return ok(t)&&(e==='Vigente'||e==='Por vencer')});
  return vig.length?vig:S.tarifas.filter(ok)
}
function ajustarQ(q){
  var L=ofrecidas(q),u=function(a){return a.filter(function(x,i){return a.indexOf(x)===i})},ch=false;
  var eqs=u(L.map(function(t){return t.equipo}));if(eqs.length&&eqs.indexOf(q.equipo)<0){q.equipo=eqs[0];ch=true}
  var L2=L.filter(function(t){return t.equipo===q.equipo}),os=u(L2.map(function(t){return t.origen}));
  if(os.length&&os.indexOf(q.origen)<0){q.origen=os[0];ch=true}
  var ds=u(L2.filter(function(t){return t.origen===q.origen}).map(function(t){return t.destino}));
  if(ds.length&&ds.indexOf(q.destino)<0){q.destino=ds[0];ch=true}
  if(ch){q.sel=[];q.buscado=false;q.rev=false}
  return {eqs:eqs,os:os,ds:ds}
}

  if(q.env)return h+vEnviada();

     '<div class="field"><label for="qc">Cliente</label><input id="qc" type="text" data-f="q.cliente" value="'+esc(q.cliente)+'"></div>'+

     '<div class="grid g2">'+cargaCampos(q)+'<div class="field"><label for="qf">Fecha de cotización</label><input id="qf" type="date" data-f="q.fecha" value="'+q.fecha+'"></div></div>'+
     '<button class="btn pri" data-a="buscar">Buscar tarifas</button><div class="note">Las tarifas vienen del módulo Tarifario. Solo se muestran las vigentes o por vencer en la fecha de cotización.</div></div>'+

     (q.sel.length?'<div class="row"><span class="sp"></span><button class="btn pri" data-a="paso" data-n="2">Continuar con '+q.sel.length+(q.sel.length===1?' opción':' opciones')+'</button></div>':'')+'</div></div>';
    return h
  }
  var opc=q.sel.map(function(id){return S.tarifas.filter(function(t){return t.id===id})[0]}).filter(Boolean),tc=+q.tc||0;
  var calc=opc.map(function(t){var c=costo(t,q,q.fecha,tc),p=precioDe(q,t,c);return {t:t,c:c,p:p,m:margenDe(p,c.total)}});
  var needTC=calc.some(function(x){return x.c.needsTC}),valid=calc.length?calc.map(function(x){return x.t.hasta}).sort()[0]:'';
  if(q.paso===2){

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start">'+calc.map(function(x,i){var t=x.t,e=estadoEn(t,q.fecha),m=x.m;
     return '<div class="opt"><div class="h"><b>Opción '+(i+1)+' · '+esc(t.prov)+'</b><div>'+pill(e)+' <span class="note">hasta '+fd(t.hasta)+'</span></div></div><div class="b">'+x.c.lines.map(function(l){return '<div class="ln'+(l.dim?' dim':'')+'"><span>'+esc(l.k)+'<br><small>'+esc(l.det)+'</small></span><span class="num">'+(l.usd==null?'—':l.ap&&!l.dim||l.k==='Flete'?money(l.usd):'USD 0')+'</span></div>'}).join('')+
      '<div class="ln" style="border-top:1px solid var(--line2);padding-top:8px;font-weight:600"><span>Costo total</span><span class="num">'+(x.c.total==null?'—':money(x.c.total))+'</span></div></div>'+

      (m&&m.m<0?'<div class="pill bad">■ Margen negativo: no se puede enviar</div>':m&&m.p<S.params.margenMin?'<div class="pill warn">▲ Menor al mínimo ('+S.params.margenMin+'%)</div>':'')+

    '<div class="card row"><div class="row"><label for="tc" class="muted">Tipo de cambio MXN por USD</label><input id="tc" type="number" step="any" style="width:100px" data-f="q.tc" value="'+esc(q.tc)+'" placeholder="17.20"><span class="note">Obligatorio si hay monedas distintas. Fecha: '+fd(q.fecha)+'</span></div><span class="sp">Validez de la cotización: <b>hasta '+fd(valid)+'</b> <span class="note">(la menor vigencia)</span></span></div>'+
    '<div class="row"><button class="btn" data-a="paso" data-n="1">Cambiar tarifas</button><span class="sp"></span><button class="btn pri" data-a="paso" data-n="3"'+(!calc.length||needTC||calc.some(function(x){return !x.p})?' disabled':'')+'>Continuar a revisión</button></div>';

  }
  // paso 3
  var bloq=[],avis=[];
  calc.forEach(function(x,i){var e=estadoEn(x.t,S.hoy);if(e.k==='Vencida'||e.k==='Programada'||!x.t.activo)bloq.push('La tarifa de '+x.t.prov+' '+(e.k==='Vencida'?'venció el '+fd(x.t.hasta):'no está vigente hoy')+'.');if(e.k==='Por vencer')avis.push(x.t.prov+' vence '+(e.left===0?'hoy':'el '+fd(x.t.hasta))+'. La cotización vale hasta esa fecha.');

  (S.embarques.length?S.embarques.map(function(b){return '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row"><h2 style="font-size:17px">'+b.id+' · '+esc(b.cliente)+'</h2><span class="sp"></span><span class="pill ok">● Creado desde COT-'+b.cot+'</span></div><div class="muted">'+esc(b.ruta)+' · '+esc(b.equipo)+' · Tarifa '+esc(b.prov)+' (vigente hasta '+fd(b.hasta)+') · Precio acordado '+money(b.precio)+'</div><div class="tblwrap"><table style="min-width:520px"><thead><tr><th>Concepto</th><th>Detalle</th><th style="text-align:right">Costo estimado</th><th style="text-align:right">Costo real</th></tr></thead><tbody>'+b.lineas.map(function(l){return '<tr><td>'+esc(l.k)+'</td><td class="muted">'+esc(l.det)+'</td><td class="n" style="text-align:right">'+(l.usd==null?'—':money(l.usd))+'</td><td class="muted" style="text-align:right">pendiente</td></tr>'}).join('')+'<tr><td><b>Total</b></td><td></td><td class="n" style="text-align:right"><b>'+money(b.total)+'</b></td><td class="muted" style="text-align:right">pendiente</td></tr></tbody></table></div><div class="note">Datos en solo lectura. Margen estimado: '+money(b.precio-b.total)+' ('+nf((b.precio-b.total)/b.precio*100,1)+'%).</div></div>'}).join(''):'<div class="card empty">Aún no hay embarques. Se crean al convertir una cotización enviada.</div>')
}

/* ---------- eventos ---------- */
function setF(path,val,el){
  var p=path.split('.');
  if(p[0]==='q'){var q=S.quote;
    if(p[1]==='modo'){q.modo=val;var eqs=activos('equipos',val);q.equipo=eqs[0]?eqs[0].n:'';q.sel=[];q.buscado=false;render();return}
    if(p[1]==='rev'){q.rev=!!el.checked;render();return}
    q[p[1]]=val;if(['equipo','origen','destino','fecha'].indexOf(p[1])>=0){if(p[1]==='origen')q.destino='';q.sel=[];q.buscado=false;q.rev=false;render()}else if(p[1]==='tc'){q.rev=false;render()}return}
  if(p[0]==='carga'){S.quote.carga[p[1]]=val;S.quote.sel=[];S.quote.buscado=false;return}
  if(p[0]==='precio'){S.quote.precios[p[1]]=val===''?null:+val;S.quote.rev=false;render();return}
  if(p[0]==='aviso'){S.params.aviso[p[1]]=Math.max(0,+val||0);save();render();return}
  if(p[0]==='margenMin'){S.params.margenMin=Math.max(0,+val||0);save();return}
  if(p[0]==='motivo'){S.modal.motivo=val;return}
  if(p[0]==='form'){
    setPath(path,el&&el.type==='checkbox'?el.checked:val);
    var rerender=['modo','equipo','unidad','desde','hasta','moneda'].indexOf(p[1])>=0||(p[1]==='rec'&&(p[3]==='incluido'||p[3]==='concepto'));
    if(rerender)render();return}
  S.f[p[0]]=val;
  if(p[0]==='q')paintTable();else{render()}
}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.f==='q'){S.f.q=t.value;paintTable()}});
document.addEventListener('change',function(e){var t=e.target,f=t.dataset&&t.dataset.f;
  if(t.id==='rol_'){S.rol=t.value;S.form=null;S.modal=null;S.mod=null;S.view=null;save();render();return}
  if(t.id==='hoy'){if(t.value){S.hoy=t.value;S.quote.rev=false;save();render()}return}
  if(!f||f==='q'&&t.type==='text'&&t.id==='fq')return;
  if(f==='q'){S.f.q=t.value;return}
  setF(f,t.type==='checkbox'?t.checked:t.value,t)});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(S.menu&&!(b&&b.dataset.a==='menu')){var mm=S.menu;S.menu=null;paintMenu();if(!b||e.target.closest('#menu')===null&&!b)return}
  if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==='menu'){var r=b.getBoundingClientRect();var same=S.menu&&S.menu.id===id;S.menu=same?null:{id:id,x:r.right,y:r.bottom};render();if(S.menu){var kb=document.querySelector('.kebab[data-id="'+id+'"]');if(kb){var r2=kb.getBoundingClientRect();S.menu.x=r2.right;S.menu.y=r2.bottom}paintMenu()}return}
  if(a==='fondo'){if(e.target===b){S.modal=null;paintModal()}return}
  var tf=function(i){return S.tarifas.filter(function(t){return t.id===i})[0]};
  if(a==='mod'){S.mod=b.dataset.m;S.view=null;S.form=null;S.modal=null;render();window.scrollTo(0,0)}
  else if(a==='nav'){S.view=b.dataset.v;S.mod=modOf(S.view);S.form=null;S.modal=null;if(S.view==='carga')S.carga={step:1,filter:'todas',res:null};render();window.scrollTo(0,0)}
  else if(a==='sort'){S.f.dir=S.f.sort===b.dataset.k?-S.f.dir:1;S.f.sort=b.dataset.k;render()}
  else if(a==='chip'){S.f.estado=S.f.estado===b.dataset.e?'':b.dataset.e;if(S.f.estado==='Por vencer'){S.f.sort='hasta';S.f.dir=1}render()}
  else if(a==='limpiar'){S.f={q:'',modo:'',estado:'',equipo:'',sort:'prov',dir:1};render()}
  else if(a==='porvencer'){S.modal={t:'pv'};paintModal()}
  else if(a==='export'){S.modal={t:'export'};paintModal()}
  else if(a==='ver'){S.modal={t:'ver',id:id};paintModal()}
  else if(a==='cerrar'){S.modal=null;paintModal()}
  else if(a==='nueva'){S.form=BLANK();render()}
  else if(a==='editar'){var t=tf(id),F=clone(t);F.errs={};F.flete=t.flete||'';F.minimo=t.minimo||'';F.recargos=t.recargos.map(function(r){return Object.assign({},r)});S.form=F;S.modal=null;S.view='tarifas';render();window.scrollTo(0,0)}
  else if(a==='cancelarform'){S.form=null;render()}
  else if(a==='addrec'){S.form.recargos.push({concepto:'',etapa:'',monto:'',moneda:'USD',unidad:S.form.unidad,incluido:false,desde:''});render()}
  else if(a==='delrec'){S.form.recargos.splice(+b.dataset.i,1);render()}
  else if(a==='addtr'){S.form.tramos.push({desde:'',hasta:null,valor:''});render()}
  else if(a==='deltr'){S.form.tramos.splice(+b.dataset.i,1);render()}
  else if(a==='guardar'){
    var F2=S.form;F2.errs=validar(F2);
    if(Object.keys(F2.errs).length){render();var el=$('.err');if(el)el.focus();return}
    var ot=traslape(F2,F2.id);
    if(ot.length){S.modal={t:'traslape',otras:ot,puede:ot.every(function(o){return F2.desde>o.desde})};paintModal();return}
    commit(F2)}
  else if(a==='cerrarant'){var F3=S.form,ot2=traslape(F3,F3.id);S.modal=null;commit(F3,ot2)}
  else if(a==='baja'){var t3=tf(id);if(!t3.activo){t3.activo=true;save();render();toast('Tarifa activada.')}else{S.modal={t:'baja',id:id};paintModal()}}
  else if(a==='okbaja'){var t4=tf(S.modal.id);if(t4.usada){if(!(S.modal.motivo||'').trim()){S.modal.err=1;paintModal();return}t4.activo=false;t4.motivo=S.modal.motivo;toast('Tarifa inactivada.')}else{S.tarifas=S.tarifas.filter(function(x){return x.id!==t4.id});toast('Tarifa eliminada.')}S.modal=null;save();render()}
  else if(a==='cstep'){S.carga.step=+b.dataset.n;render()}
  else if(a==='cfil'){S.carga.filter=b.dataset.k;render()}
  else if(a==='cimport'){var rows=filasCarga(),n=0,er=0,du=0;rows.forEach(function(x){if(x.v.k==='ok'){var v=x.v.t;S.tarifas.push({id:'t'+(S.nextId++),prov:v.prov,modo:v.modo,origen:v.origen,destino:v.destino,equipo:v.equipo,unidad:v.unidad,flete:v.flete,moneda:v.moneda,minimo:0,desde:v.desde,hasta:v.hasta,recargos:[],tramos:[],fuente:'Carga masiva',activo:true,version:1,usada:false,hist:[]});n++}else if(x.v.k==='error')er++;else du++});S.carga={step:4,filter:'todas',res:{ok:n,error:er,dup:du}};save();render()}
  else if(a==='lista'){S.lista=b.dataset.k;render()}
  else if(a==='addlista'){var nm=$('#nn').value.trim(),k=S.lista,x=$('#nx');
    if(!nm){$('#lerr').textContent='Escribe un nombre.';return}
    if(S.listas[k].some(function(y){return norm(y.n)===norm(nm)})){$('#lerr').textContent='Ya existe “'+nm+'” en esta lista.';return}
    var item={n:nm,a:1};if(x)item.x=x.value;S.listas[k].push(item);save();render();toast('Valor agregado.')}
  else if(a==='toglista'){var it=S.listas[S.lista][+b.dataset.i];it.a=it.a?0:1;save();render()}
  else if(a==='dellista'){S.listas[S.lista].splice(+b.dataset.i,1);save();render()}
  else if(a==='buscar'){S.quote.buscado=true;render()}
  else if(a==='selt'){var q=S.quote,ix=q.sel.indexOf(id);if(ix>=0)q.sel.splice(ix,1);else if(q.sel.length<3)q.sel.push(id);q.rev=false;if(!q.sel.length&&q.paso>1)q.paso=1;render()}
  else if(a==='paso'){S.quote.paso=+b.dataset.n;render();window.scrollTo(0,0)}
  else if(a==='enviar'){var q2=S.quote,tc2=+q2.tc||0;var opc=q2.sel.map(function(i){return tf(i)}).map(function(t){var c=costo(t,q2,q2.fecha,tc2);return {id:t.id,prov:t.prov,hasta:t.hasta,lineas:c.lines.map(function(l){return {k:l.k,det:l.det,usd:l.usd}}),total:c.total,precio:precioDe(q2,t,c)}});
    opc.forEach(function(o){tf(o.id).usada=true});q2.env={num:S.nextCot++,por:'Ventas',fecha:S.hoy,opc:opc};save();render();window.scrollTo(0,0);toast('Cotización enviada.')}
  else if(a==='conv'){var q3=S.quote,o=q3.env.opc[+b.dataset.i],id2='EMB-'+String(S.nextEmb++).padStart(3,'0');
    S.embarques.unshift({id:id2,cot:q3.env.num,cliente:q3.cliente,ruta:q3.origen+' → '+q3.destino,equipo:q3.equipo,prov:o.prov,hasta:o.hasta,precio:o.precio,lineas:o.lineas,total:o.total});q3.emb=id2;save();render();toast('Embarque creado.')}
  else if(a==='nueva-cot'){S.quote=newQuote(S.hoy);render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.menu){S.menu=null;render()}});
window.addEventListener('scroll',function(){if(S.menu){S.menu=null;paintMenu()}},{passive:true});
$('#reset').addEventListener('click',function(){try{localStorage.removeItem(STORE)}catch(e){}load();render();toast('Datos de ejemplo restaurados.')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;paintModal()}});
load();S.quote=S.quote&&S.quote.carga?S.quote:newQuote(S.hoy);render();
})();
</script>
